services:
  - type: web
    name: aeo-optimizer
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: ADK_MODEL
        value: gemini-2.5-flash
      - key: MAX_PRODUCTS
        value: "10"
      - key: APP_NAME
        value: agents
      - key: PYTHONUNBUFFERED
        value: "1"
